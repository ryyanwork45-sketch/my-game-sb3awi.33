DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>عدّاء المترو بيكسل</title><style>
:root{color-scheme:dark;--ac:#ffd23f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:radial-gradient(#1b1650,#07070f);color:#fff;font-family:Tahoma,Arial,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
body{display:flex;align-items:center;justify-content:center}
#w{position:relative;width:min(100vw,56.25vh);height:min(100vh,177.78vw);container-type:size;touch-action:none;box-shadow:0 0 6cqw #000}
canvas{image-rendering:pixelated;display:block}#c{width:100%;height:100%}
.ov{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;background:linear-gradient(#0a0a2cd9,#000e);font-size:4.2cqw;text-align:center;padding:3cqw;overflow:auto;touch-action:pan-y;animation:fd .3s}
.in{margin:auto;display:flex;flex-direction:column;align-items:center;gap:2.4cqw;width:100%}
@keyframes fd{from{opacity:0;transform:scale(.94)}}@keyframes bob{50%{transform:translateY(-1.6cqw)}}@keyframes pl{50%{transform:scale(1.08)}}
h1{font-size:9.5cqw;margin:0;color:var(--ac);text-shadow:.8cqw .8cqw #e63946,1.6cqw 1.6cqw #000;animation:bob 2s infinite;line-height:1.2}
h2{margin:0;font-size:6.5cqw;color:var(--ac);text-shadow:.5cqw .5cqw #000}
.b{font:inherit;font-weight:bold;color:#2a1c00;background:linear-gradient(#ffe680,#ffc21f);border:0;border-bottom:1cqw solid #b07a00;box-shadow:0 0 0 .5cqw #000;padding:1.6cqw 6cqw;border-radius:2cqw;cursor:pointer;min-width:42cqw;transition:transform .1s}
.b:hover{filter:brightness(1.1)}.b:active{transform:translateY(.8cqw);border-bottom-width:.2cqw}
.b.g{background:linear-gradient(#8ff58f,#2fbf4f);border-bottom-color:#1a7a30;color:#06300f}.b.p{background:linear-gradient(#d9a0ff,#9b4fe0);border-bottom-color:#5e2a96;color:#fff}.b.r{background:linear-gradient(#ff9a9a,#e03a3a);border-bottom-color:#8a1c1c;color:#fff}
.b:disabled{background:#4a4a5a;border-bottom-color:#2a2a35;color:#999;cursor:default}.big{font-size:6cqw;animation:pl 1.4s infinite}
.row{display:flex;gap:2cqw;justify-content:center;flex-wrap:wrap}
.chip{background:#0009;border:.4cqw solid #fff3;border-radius:5cqw;padding:.8cqw 3.5cqw;font-weight:bold}
.gr{display:grid;grid-template-columns:1fr 1fr;gap:2.4cqw;width:96%}
.it{background:linear-gradient(#262a63,#171a42);border:.6cqw solid #3a3f80;border-radius:2.4cqw;padding:2cqw;display:flex;flex-direction:column;gap:1.2cqw;align-items:center;font-size:3.6cqw;box-shadow:0 .8cqw 0 #0008}
.it.on{border-color:var(--ac);box-shadow:0 0 3cqw #ffd23f66}.it.hd{border-color:#b45cff}
.it canvas{width:20cqw;background:#0006;border-radius:1.5cqw}
.bar{height:2.4cqw;background:#000;border-radius:2cqw;overflow:hidden;margin:1cqw 0}.bar i{display:block;height:100%;background:linear-gradient(#8ff58f,#2fbf4f)}
#hbb{position:absolute;bottom:4cqw;left:4cqw;display:none;font-size:4cqw;min-width:0;padding:2.5cqw 4cqw}
#pz{position:absolute;top:10cqw;left:2.5cqw;display:none;min-width:0;padding:.8cqw 2.5cqw;font-size:4cqw}
#toast{position:absolute;top:20cqw;left:50%;transform:translateX(-50%);background:#2fbf4f;color:#fff;font-weight:bold;padding:1.5cqw 5cqw;border-radius:4cqw;display:none;font-size:4cqw;box-shadow:0 0 0 .5cqw #000;animation:bob .6s 3}
#pv{width:26cqw;animation:bob 1s infinite}
</style></head><body><div id="w"><canvas id="c" width="270" height="480"></canvas>
<button class="b" id="hbb" data-a="hb">🛹 H</button><button class="b" id="pz" data-a="pause">⏸</button><div id="toast"></div>
<div class="ov" id="menu"><div class="in"><div class="row" id="chips"></div><h1>عدّاء المترو<br>بيكسل</h1><canvas id="pv" width="60" height="80"></canvas><div id="mi"></div>
<button class="b big" data-a="play">▶ ابدأ اللعب</button><div class="row"><button class="b p" data-a="store">🛒 المتجر</button><button class="b g" data-a="missions" id="mb">🎯 المهمات</button></div><button class="b" data-a="mute" style="min-width:0">🔊 الصوت يعمل</button>
<div style="font-size:3cqw;line-height:1.7;opacity:.8">← → تغيير المسار · ↑ قفز · ↓ انزلاق · H لوح التزلج · P إيقاف<br>على الهاتف: اسحب بالإصبع</div></div></div>
<div class="ov" id="store"></div><div class="ov" id="miss"></div><div class="ov" id="over"></div>
<div class="ov" id="rv"><div class="in"><h2>💥 تحطّمت!</h2><div>هل تريد المتابعة من نفس المكان؟</div><div class="bar" style="width:70%"><i id="rvb" style="width:100%;background:#e03a3a"></i></div><button class="b g big" data-a="revive" id="rvg">💎 أكمل</button><button class="b r" data-a="tomenu">🏠 القائمة</button></div></div>
<div class="ov" id="paus"><div class="in"><h2>⏸ إيقاف مؤقت</h2><button class="b g" data-a="pause">▶ متابعة</button><button class="b r" data-a="tomenu">🏠 القائمة</button></div></div></div>
<script>
const $=i=>document.getElementById(i),C=$('c');let X=C.getContext('2d');const W=270,H=480,HZ=130,GY=410,LW=62;
let S={};try{S=JSON.parse(localStorage.getItem('sp4')||'{}')}catch(e){}
S.coins=S.coins||0;S.gems=S.gems==null?5:S.gems;S.best=S.best||0;S.ownS=S.ownS||['jake'];S.ownB=S.ownB||['basic'];S.skin=S.skin||'jake';S.board=S.board||'basic';S.ms=S.ms||[];
const save=()=>{try{localStorage.setItem('sp4',JSON.stringify(S))}catch(e){}};
// [name,price,[shirt,pants,skin,hair,pack],hat]
const SK={jake:['جيك',0,['#2f6fe0','#3b3f66','#f0b98a','#e63946','#ffd23f'],'cap'],neon:['نيون',150,['#ff2bd6','#2b2bff','#f0b98a','#00f5d4','#fff'],'mohawk'],ninja:['النينجا',300,['#2a2a2a','#151515','#e0b090','#d11','#555'],'band'],gold:['الملك',600,['#ffd23f','#c98a00','#f0b98a','#ffe066','#a06a00'],'crown'],robot:['الروبوت',1000,['#9aa7b5','#5b6775','#c7d1db','#00e0ff','#ff5d5d'],'ant']};
const BD={basic:['الكلاسيكي',0,'#4cc9f0',20,0,0,'درع 20 ث'],flame:['اللهب',250,'#ff7b00',30,1,0,'درع 30 ث + مغناطيس'],ice:['الجليد',500,'#a0e8ff',30,0,1,'درع 30 ث + عملات ×2'],gold:['الذهبي',900,'#ffd23f',40,1,1,'درع 40 ث + مغناطيس + ×2']};
const PD={mag:['M','#e33',10,'مغناطيس'],jet:['J','#fa0',6,'جيتباك!'],sn:['S','#3c3',12,'قفزة خارقة'],x2:['×2','#38f',15,'×2 نقاط']};
// missions: text, targets, rewards (hard ones give gems)
const MT={coin:['اجمع {n} عملة',[60,100,150],[50,80,120]],jump:['اقفز {n} مرة',[15,25,40],[50,80,120]],roll:['انزلق {n} مرات',[10,15,25],[50,80,120]],pw:['التقط {n} قدرات',[2,3,4],[60,90,130]],hb:['شغّل لوح التزلج {n} مرات',[1,2,3],[60,90,130]],run:['العب {n} جولات',[2,3,4],[40,70,100]],
 hscore:['حقق {n} نقطة في جولة واحدة',[3000,5000],[2,3]],hcoin:['اجمع {n} عملة في جولة واحدة',[150,250],[2,3]],hpw:['التقط {n} قدرات في جولة واحدة',[5,7],[2,3]]};
function newM(){const hard=Math.random()<.22&&!S.ms.some(m=>m.g),ks=Object.keys(MT).filter(k=>(k[0]=='h'&&k!='hb'&&k!='hpw'||k=='hpw')==hard&&!S.ms.some(m=>m.t==k));
 const k=ks[Math.random()*ks.length|0]||'run',T=MT[k],i=Math.random()*T[1].length|0;return{t:k,n:T[1][i],p:0,d:0,r:T[2][i],g:hard}}
while(S.ms.length<3)S.ms.push(newM());
function tst(t){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(tst.h);tst.h=setTimeout(()=>e.style.display='none',2200)}
function mchk(m){if(!m.d&&m.p>=m.n){m.p=m.n;m.d=1;tst('✅ مهمة مكتملة! افتح المهمات');fan([523,659,784,1046]);save()}}
function mp(t,n){for(const m of S.ms)if(m.t==t&&!m.d){m.p+=n;mchk(m)}}
function mset(t,v){for(const m of S.ms)if(m.t==t&&!m.d){m.p=Math.max(m.p,v|0);mchk(m)}}
// audio
let AC,NB,mute=false;
function ia(){if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();NB=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}AC.resume()}
function snd(f,d,t='square',v=.07,e=0,dl=0){if(mute||!AC)return;const o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime+dl;o.type=t;o.frequency.setValueAtTime(f,n);if(e)o.frequency.exponentialRampToValueAtTime(e,n+d);g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(AC.destination);o.start(n);o.stop(n+d)}
function nz(d,v=.08,fq=2000){if(mute||!AC)return;const s=AC.createBufferSource(),g=AC.createGain(),f=AC.createBiquadFilter(),n=AC.currentTime;s.buffer=NB;f.type=fq>5000?'highpass':'lowpass';f.frequency.value=fq;g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);s.connect(f);f.connect(g);g.connect(AC.destination);s.start(n);s.stop(n+d)}
const fan=a=>a.forEach((f,i)=>snd(f,.16,'square',.07,0,i*.09));
const BS=[110,0,110,0,131,0,131,0,98,0,98,0,123,0,147,0],LD=[440,0,523,0,659,0,523,0,392,0,494,0,587,0,494,0];let ms=0;
setInterval(()=>{if(state=='play'){const i=ms++%16,b=BS[i];if(b)snd(b,.14,'triangle',.11);if(LD[i])snd(LD[i],.07,'square',.02);if(i%4==0)snd(130,.12,'sine',.14,40);if(i%8==4)nz(.1,.05,2500);if(i%2)nz(.03,.02,8000)}},125);
// state
let G,state='menu',tab='s';
function reset(){G={z:0,x:0,tl:1,h:0,vy:0,roll:0,sp:22,t:0,score:0,coins:0,ob:[],nx:20,pw:{mag:0,jet:0,sn:0,x2:0},hb:0,hbCd:0,inv:0,dead:0,shake:0,fx:[],ft:[],pwc:0,rv:0,cb:0,ct:0,ht:0,fl:0,sq:0}}
reset();
const ob=(l,k,z,len,e)=>G.ob.push(Object.assign({l,k,z,len:len||1},e));
function seg(){const z=80,f=Math.random()*3|0,jet=G.pw.jet>0;let tr=0;
 for(let l=0;l<3;l++)if(l!=f&&Math.random()<.75){const r=Math.random();if(r<.4){ob(l,'T',z,6+(Math.random()*4|0),{c:Math.random()*4|0});tr=1}else if(r<.7)ob(l,'L',z);else ob(l,'H',z)}
 if(tr&&Math.random()<.5)setTimeout(()=>{if(state=='play'){snd(180,.5,'sawtooth',.05,170);snd(225,.5,'sawtooth',.04,215)}},500);
 const arc=Math.random()<.4,n=6;
 for(const l of jet?[0,1,2]:[f])for(let i=0;i<n;i++)ob(l,'c',z+i*3,0,{h:jet?85:arc?10+Math.sin(i/(n-1)*Math.PI)*50:10});
 const r=Math.random();if(r<.09)ob(f,'p',z+20,0,{h:20,p:['mag','jet','sn','x2'][Math.random()*4|0]});else if(r<.12)ob(f,'g',z+20,0,{h:20});
 G.nx=24+Math.random()*8}
const fx=(x,y,c,n,s)=>{for(let i=0;i<n;i++)G.fx.push({x,y,vx:(Math.random()-.5)*s,vy:(Math.random()-.8)*s,l:.4+Math.random()*.4,c})};
const ft=(x,y,t,c)=>G.ft.push({x,y,t,c,l:1});
function crash(o){const g=G,px=W/2+g.x*LW;
 if(g.hb>0){g.hb=0;g.hbCd=10;g.inv=1.5;g.shake=1;o.dead=1;nz(.4,.2,1500);snd(150,.4,'sawtooth',.15,40);fx(px,GY-g.h-10,BD[S.board][2],30,140);ft(px,GY-60,'تحطّم اللوح!',BD[S.board][2])}
 else{g.dead=1;g.shake=1.2;nz(.6,.25,900);snd(200,.7,'sawtooth',.18,30);snd(100,.5,'sine',.2,30);fx(px,GY-g.h-15,'#fff',30,160);fx(px,GY-g.h-15,'#ffd23f',20,120);
  state='rv';g.rvt=6;const c=3*(1<<g.rv);g.cost=c;$('rvg').textContent='💎 أكمل ('+c+')';$('rvg').disabled=S.gems<c;$('rvg').dataset.c=c;show('rv',1);$('hbb').style.display=$('pz').style.display='none'}}
function upd(dt){const g=G;g.t+=dt;g.sp=Math.min(22+g.t*.35,46);const v=g.sp*dt;g.z+=v;g.score+=v*(g.pw.x2>0?2:1)*.6;
 for(const k in g.pw)if(g.pw[k]>0){g.pw[k]-=dt;if(k=='jet'&&g.pw[k]<=0)g.inv=1.2}
 if(g.hb>0){g.hb-=dt;if(g.hb<=0)g.hbCd=10;if((g.ht-=dt)<=0){g.ht=.25;snd(220+Math.random()*30,.2,'sine',.03)}}else if(g.hbCd>0)g.hbCd-=dt;
 g.inv-=dt;g.roll-=dt;g.sq-=dt;if((g.ct-=dt)<=0)g.cb=0;g.x+=(g.tl-1-g.x)*Math.min(1,dt*14);
 const jet=g.pw.jet>0,px=W/2+g.x*LW;
 if(jet){g.h+=(95-g.h)*Math.min(1,dt*4);g.vy=0;fx(px,GY-g.h-8,Math.random()<.5?'#ff8a00':'#ffe066',1,60);if((g.fl-=dt)<=0){g.fl=.09;snd(70+Math.random()*40,.1,'sawtooth',.04);nz(.08,.03,3000)}}
 else{const pv=g.vy;g.vy-=330*dt;g.h+=g.vy*dt;if(g.h<=0){g.h=0;g.vy=0;if(pv<-120){snd(90,.12,'sine',.12,50);fx(px,GY,'#999',6,60);g.sq=.12}else if(Math.random()<.3)fx(px,GY,'#888',1,40)}}
 g.nx-=v;if(g.nx<=0)seg();
 const bd=BD[S.board],mag=g.pw.mag>0||(g.hb>0&&bd[4]),dbl=(g.pw.x2>0?2:1)*(g.hb>0&&bd[5]?2:1);
 const y0=g.h,y1=g.h+(g.roll>0&&g.h<1?18:38),pl=g.x+1;
 for(const o of g.ob){o.z-=v;if(o.dead)continue;
  if(o.k=='c'||o.k=='p'||o.k=='g'){
   if(mag&&o.k=='c'&&o.z<28&&o.z>-2)o.l+=(pl-o.l)*Math.min(1,dt*10);
   if(Math.abs(o.l-pl)<.55&&o.z<1.5&&o.z>-1.5&&o.h>y0-8&&o.h<y1+8){o.dead=1;const ox=W/2+(o.l-1)*LW;
    if(o.k=='c'){g.coins+=dbl;g.cb++;g.ct=.6;snd(880+Math.min(g.cb,10)*60,.08,'square',.06);snd(1320+Math.min(g.cb,10)*60,.06,'triangle',.04,0,.04);mp('coin',1);fx(ox,GY-o.h,'#ffd23f',5,70)}
    else if(o.k=='g'){S.gems++;fan([784,988,1175,1568]);ft(ox,GY-50,'+1 💎','#7df');fx(ox,GY-o.h,'#7df',16,100);save()}
    else{g.pw[o.p]=PD[o.p][2];g.pwc++;mp('pw',1);fan(o.p=='jet'?[392,523,659,784,1046]:[500,700,900,1200]);ft(px,GY-g.h-50,PD[o.p][3],PD[o.p][1]);fx(px,GY-g.h-20,PD[o.p][1],18,100)}}
  }else if(!jet&&g.inv<=0&&Math.abs(o.l-pl)<.6&&o.z<1&&o.z+o.len>-1){
   const r=o.k=='T'?[0,72]:o.k=='L'?[0,16]:[24,50];if(y0<r[1]&&y1>r[0])crash(o)}}
 g.ob=g.ob.filter(o=>!o.dead&&o.z+o.len>-6)}
function fxu(dt){G.shake-=dt*2;for(const p of G.fx){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=200*dt;p.l-=dt}G.fx=G.fx.filter(p=>p.l>0);for(const f of G.ft){f.y-=25*dt;f.l-=dt}G.ft=G.ft.filter(f=>f.l>0)}
// controls
function lane(d){if(state!='play')return;const n=Math.max(0,Math.min(2,G.tl+d));if(n!=G.tl){G.tl=n;nz(.08,.05,3000);snd(300,.08,'triangle',.07,500)}}
function jump(){if(state!='play'||G.pw.jet>0)return;if(G.h<=.5){G.vy=G.pw.sn>0?290:195;G.roll=0;mp('jump',1);snd(350,.2,'square',.07,900);if(G.pw.sn>0)snd(700,.25,'sine',.05,1400)}}
function roll(){if(state!='play')return;if(G.h<=.5){G.roll=.6;mp('roll',1);nz(.2,.08,2000);snd(250,.2,'sawtooth',.05,100)}else{G.vy=-380;snd(500,.12,'square',.05,150)}}
function board(){if(state!='play'||G.hb>0||G.hbCd>0)return;G.hb=BD[S.board][3];mp('hb',1);snd(300,.4,'sine',.1,1200);nz(.3,.07,4000);fx(W/2+G.x*LW,GY-G.h,BD[S.board][2],24,110);ft(W/2+G.x*LW,GY-70,'🛹 '+BD[S.board][0],BD[S.board][2])}
function pause(){if(state=='play'){state='pause';show('paus',1)}else if(state=='pause'){state='play';show('paus',0)}}
const KM={ArrowLeft:()=>lane(-1),KeyA:()=>lane(-1),ArrowRight:()=>lane(1),KeyD:()=>lane(1),ArrowUp:jump,KeyW:jump,Space:jump,ArrowDown:roll,KeyS:roll,KeyH:board,KeyE:board,KeyP:pause,Escape:pause};
addEventListener('keydown',e=>{ia();const f=KM[e.code];if(f){f();e.preventDefault()}});
let tx,ty;$('w').addEventListener('pointerdown',e=>{ia();tx=e.clientX;ty=e.clientY});
$('w').addEventListener('pointerup',e=>{if(tx==null||state!='play')return;const dx=e.clientX-tx,dy=e.clientY-ty;if(Math.max(Math.abs(dx),Math.abs(dy))>25){if(Math.abs(dx)>Math.abs(dy))lane(dx>0?1:-1);else dy<0?jump():roll()}tx=null});
// screens
const show=(id,v)=>$(id).style.display=v?'flex':'none';
const hideAll=()=>['menu','store','miss','over','rv','paus'].forEach(i=>show(i,0));
function endRun(){if(G.banked)return;G.banked=1;S.coins+=G.coins;S.best=Math.max(S.best,G.score);mset('hscore',G.score);mset('hcoin',G.coins);mset('hpw',G.pwc);save()}
function menu(){hideAll();show('menu',1);state='menu';$('mi').innerHTML='🏆 أفضل نتيجة: '+Math.floor(S.best);$('chips').innerHTML=`<span class="chip">🪙 ${S.coins}</span><span class="chip">💎 ${S.gems}</span>`;$('mb').textContent=S.ms.some(m=>m.d)?'🎯 المهمات ❗':'🎯 المهمات';$('hbb').style.display=$('pz').style.display='none'}
function play(){ia();hideAll();reset();state='play';mp('run',1);$('hbb').style.display=$('pz').style.display='block'}
function over(){endRun();state='over';hideAll();$('hbb').style.display=$('pz').style.display='none';
 $('over').innerHTML=`<div class="in"><h2>انتهت اللعبة!</h2><div class="it" style="width:80%;font-size:4.4cqw">النتيجة: ${Math.floor(G.score)}<br>🪙 +${G.coins} (المجموع ${S.coins})<br>💎 ${S.gems} · 🏆 ${Math.floor(S.best)}</div><button class="b g big" data-a="play">↻ العب مجدداً</button><div class="row"><button class="b p" data-a="store">🛒 المتجر</button><button class="b" data-a="missions">🎯 المهمات</button></div><button class="b r" data-a="tomenu">🏠 القائمة</button></div>`;show('over',1)}
